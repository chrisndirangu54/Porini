services:
  api:
    build: ./backend
    environment:
      PORINI_API_KEY: ${PORINI_API_KEY:-local-dev-key}
      PORINI_ENABLE_DEMO: ${PORINI_ENABLE_DEMO:-false}
      PORINI_TENANT_ID: ${PORINI_TENANT_ID:-demo-conservancy}
      PORINI_DB_PATH: /data/porini_extensions.sqlite3
    volumes:
      - porini_data:/data
    ports:
      - "8000:8000"
volumes:
  porini_data:
